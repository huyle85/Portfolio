<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="menu_mobile">&#8943;</button>
    <header>
        <a class="logo" href="#">Huy Le</a>
        <nav>
            <a href="homepage.html" class="active">Home</a>
            <a href="education.html">Education</a>
            <a href="awards.html">Awards</a>
            <a href="project.html">Project</a>
        </nav>
    </header>
    <main class="admin_card">
        <h2>Admin Dashboard</h2>
        <form action="" class="admin_form">
            

            <div class="main_layout_grid">
                
                <div class="left_col">
                    <div class="form_gird">
                        <div class="form_group">
                            <label for="">Avatar</label>
                            <input type="file">
                        </div>
                        <div class="form_group">
                            <Label for="">Tiêu đề 1</Label>
                            <input type="text">
                        </div>
                        <div class="form_group">
                            <label for="">Tiêu đề 2</label>
                            <input type="text">
                        </div>
                        <div class="form_group">
                            <label for="">Tiêu đề 3</label>
                            <input type="text">
                        </div>
                    </div>

                    <hr class="divider">

                    <div class="form_gird2">
                        <div class="form_group">
                            <label for="">Education</label>
                            <input type="text">
                        </div>
                        <div class="form_group">
                            <label for="">Ảnh trường</label>
                            <input type="file">
                        </div>
                        <div class="form_group">
                            <label for="">Mô tả về trường</label>
                            <input type="text">
                        </div>
                        <div class="form_group">
                            <label for="">Achievement</label>
                            <textarea rows="5">Awarded Excellent Academic Scholarship (Semester 1, 2024-2025)
Achieved a 9.0/10 grade in System Analysis and Design for UI/UX Layout Design
GPA: 3.6</textarea>
                        </div>
                        <div class="form_group">
                            <label for="">Certificate</label>
                            <textarea rows="5">English Proficiency: B1 Level (CEFR)</textarea>
                        </div>
                    </div>
                </div>

                <div class="right_col">
                    <div class="project_manager">
                        <div class="form_group">
                            <label for="">Tên dự án</label>
                            <textarea rows="1"></textarea>
                            <label for="">Mô tả</label>
                            <textarea rows="5"></textarea>
                        </div>
                        <button type="button" class="add_project">Add project</button>
                        <hr class="divider">
                        <label for="">Project hiện có</label>
                        <div class="project_item_gird">
                            <div class="project_item">
                                <span>Backend for an e-commerce system</span>
                                <div class="button_edit">
                                    <button class="button_action" type="button">Sửa</button>
                                    <button class="button_action" type="button">Xóa</button>
                                </div>
                            </div>
                            <div class="project_item">
                                <span>English to Script Translator Tool</span>
                                <div class="button_edit">
                                    <button class="button_action" type="button">Sửa</button>
                                    <button class="button_action" type="button">Xóa</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div> 

            <button type="button" class="button_save">Lưu tất cả cập nhật</button>
        </form>
    </main>
</body>
</html>
